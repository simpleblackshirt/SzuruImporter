name: Build release
on:
  push:
    # `branches` must stay defined: with only `tags`, branch pushes stop triggering.
    branches:
      - '**'
    tags:
      - 'v*'
    # Path filters are not evaluated for tag pushes (GitHub docs), so tags always build.
    paths:
      - src/**
      - extension/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      publish_amo_listed:
        description: "Publish to AMO"
        required: false
        type: boolean
jobs:
  build_chrome:
    name: "Build Chrome Extension"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-for-build

      - name: Build
        run: pnpm build

      - name: Pack ZIP
        run: pnpm pack:zip

      - uses: actions/upload-artifact@v4
        with:
          name: Chrome Extension (Unsigned)
          path: extension.zip

  build_unlisted_firefox:
    name: "Build Unlisted Firefox Extension"
    runs-on: ubuntu-24.04
    # Doesn't really need the Chrome build, but we can reuse its cache.
    needs: build_chrome
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-for-build

      - name: Build
        run: pnpm build
        env:
          SZ_GECKO_ID: 13372607-2257-4360-8f51-5ce66fa73350

      - name: Sign XPI
        run: pnpm sign:firefox --channel unlisted
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

      - name: Rename XPI
        run: |
          cd web-ext-artifacts
          for f in *.xpi; do mv "$f" "SzuruImporter-v${f#*-}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Firefox Extension (Signed)
          path: web-ext-artifacts/*.xpi

  build_amo_firefox:
    name: "Build Firefox Extension for AMO"
    runs-on: ubuntu-24.04
    # Doesn't really need the Chrome build, but we can reuse its cache.
    needs: build_chrome
    # Only run when manually dispatching with the publish_amo_listed input.
    if: github.event.inputs.publish_amo_listed == true
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-for-build

      - name: Build
        run: pnpm build
        env:
          SZ_GECKO_ID: 18365332-8485-4c04-9498-2843a41ab620

      - name: Sign XPI and upload to AMO
        run: pnpm sign:firefox --channel listed
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

  release:
    name: "Create GitHub release"
    runs-on: ubuntu-24.04
    needs: [build_chrome, build_unlisted_firefox]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Rename Chrome zip
        run: mv release/extension.zip "SzuruImporter-${GITHUB_REF_NAME}-chrome.zip"

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}
