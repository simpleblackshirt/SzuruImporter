name: Build release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_amo_listed:
        description: "Publish to AMO"
        required: false
        type: boolean
jobs:
  build_chrome:
    name: "Build Chrome Extension"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-for-build

      - name: Build
        run: pnpm build

      - name: Pack ZIP
        run: pnpm pack:zip

      - uses: actions/upload-artifact@v4
        with:
          name: Chrome Extension (Unsigned)
          path: extension.zip

  build_unlisted_firefox:
    name: "Build Unlisted Firefox Extension"
    runs-on: ubuntu-24.04
    # Sign only on release tags: every signature burns the version number on
    # AMO (re-signing the same version returns 409 forever), so master pushes
    # must never sign
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-for-build

      - name: Build
        run: pnpm build
        env:
          SZ_GECKO_ID: f6d4bf83-7ee3-40c1-87b7-33e677459166

      - name: Sign XPI
        run: pnpm sign:firefox --channel unlisted
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

      - name: Rename XPI
        run: |
          cd web-ext-artifacts
          for f in *.xpi; do mv "$f" "SzuruImporter-v${f#*-}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Firefox Extension (Signed)
          path: web-ext-artifacts/*.xpi

  build_amo_firefox:
    name: "Build Firefox Extension for AMO"
    runs-on: ubuntu-24.04
    # Only run when manually dispatching with the publish_amo_listed input.
    if: github.event.inputs.publish_amo_listed == true
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-for-build

      - name: Build
        run: pnpm build
        env:
          SZ_GECKO_ID: f6d4bf83-7ee3-40c1-87b7-33e677459166

      - name: Sign XPI and upload to AMO
        run: pnpm sign:firefox --channel listed
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

  release:
    name: "Create GitHub release"
    runs-on: ubuntu-24.04
    needs: [build_chrome, build_unlisted_firefox]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Rename Chrome zip
        run: mv release/extension.zip "SzuruImporter-${GITHUB_REF_NAME}-chrome.zip"

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
